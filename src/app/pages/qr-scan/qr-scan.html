<div class="qr-scan">
  <!-- Top bar -->
  <div class="topbar">
    <button class="icon-btn" (click)="back()" aria-label="Quay lại">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <h1 class="title">Quét mã QR</h1>
    <span class="icon-btn placeholder"></span>
  </div>

  <!-- Brand row -->
  <div class="brand-row">
    <span class="logo-bar">
      <img class="lg vietqr" src="images/vietqr.png" alt="VietQR" />
      <span class="d"></span>
      <img class="lg woori" src="images/Won-banner.png" alt="Woori Bank" />
    </span>
  </div>

  <!-- Camera viewfinder -->
  <div class="viewfinder">
    @if (!cameraError()) {
      <video #video class="cam" autoplay playsinline muted></video>
    } @else {
      <div class="cam-error">
        <mat-icon>no_photography</mat-icon>
        <span>Không mở được camera</span>
      </div>
    }
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    <mat-icon class="plus">add</mat-icon>
  </div>

  <!-- Payment networks -->
  <div class="pay-row">
    <span class="logo-bar small">
      <img class="lg vietqr" src="images/vietqr_trim.png" alt="VietQR" />
      <span class="d"></span>
      <img class="lg napas" src="images/Napas247_trim.png" alt="napas 247" />
      <span class="d"></span>
      <img class="lg vnpay" src="images/vnpay_trim.png" alt="VNPAY" />
    </span>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button class="pill" (click)="goToMyQr()">QR của tôi</button>
    <button class="pill">Lịch sử thanh toán</button>
  </div>

  <!-- Gallery -->
  <button class="gallery">
    <mat-icon>collections</mat-icon>
    <span>Thư viện ảnh</span>
  </button>
</div>
