<!doctype html>
<html lang="vi" style="background:#5a9cf8">
<head>
  <meta charset="utf-8">
  <title>Demo Banking</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5a9cf8">

  <!-- PWA: Hide address bar on iOS (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WON">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    .ios-top-edge { display: none }
    @supports (-webkit-touch-callout: none) {
      @media (display-mode: standalone) {
        html.notch-blue body > .ios-top-edge,
        body:has(> app-root:empty) > .ios-top-edge {
          display: block;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 8px;
          background: #5a9cf8;
          z-index: 999999;
          pointer-events: none;
        }
      }
    }
  </style>

  <!-- PWA icons for iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/WON-APP-IPHONE.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div class="ios-top-edge" aria-hidden="true"></div>
<app-root></app-root>
</body>
</html>
